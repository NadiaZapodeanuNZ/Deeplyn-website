<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h2>Hello, <strong>{{ username }}</strong>!</h2>
    <p>To activate your Deeplyn account, use this verification code:</p>
    <div style="background-color: #7c3aed; color: white; padding: 16px 32px; 
                font-size: 32px; font-weight: bold; letter-spacing: 8px; 
                text-align: center; border-radius: 8px; margin: 24px 0;">
        {{ token }}
    </div>
    <p>This code is valid for <strong>5 minutes</strong>.</p>
    <p style="color: #888;">If you did not create an account, please ignore this email.</p>
    <p>Best regards,<br><strong>Deeplyn</strong></p>
</body>
</html>
