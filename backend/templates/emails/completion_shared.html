<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h2>Hello, <strong>{{ therapist_first_name }} {{ therapist_last_name }}</strong>!</h2>
    <p>Your patient <strong>{{ client_first_name }} {{ client_last_name }}</strong> has shared a completed exercise with you.</p>
    
    <div style="background-color: #f3f0ff; border-left: 4px solid #7c3aed; 
                padding: 16px; border-radius: 8px; margin: 24px 0;">
        <p style="margin: 0;"><strong>Title:</strong> {{ exercise_title }}</p>
        <p style="margin: 8px 0 0 0;"><strong>Category:</strong> {{ exercise_category }}</p>
    </div>

    <a href="http://localhost:5173"
       style="display: block; background-color: #7c3aed; color: white; padding: 16px 32px;
              font-size: 18px; font-weight: bold;
              text-align: center; border-radius: 8px; margin: 24px 0;
              text-decoration: none;">
        View Completion in Deeplyn
    </a>
    <p>Best regards,<br><strong>Deeplyn</strong></p>
</body>
</html>
